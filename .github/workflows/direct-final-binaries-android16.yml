name: Android 16 final frozen direct-session binaries
on:
  push:
    branches: [qa/direct-final-android16]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Verify frozen binaries and stage identical test harness
        run: |
          cd test-fixtures/direct-final
          sha256sum -c SHA256SUMS
          cd ../..
          mkdir -p app/build/intermediates/apk/rootlessFdroid/release app/build/intermediates/apk/androidTest/rootlessFdroid/release audio-capture-probe/build/intermediates/apk/debug
          cp test-fixtures/direct-final/app-x86_64.apk app/build/intermediates/apk/rootlessFdroid/release/ViPER4Android-rootless-fdroid-x86_64-release.apk
          cp test-fixtures/direct-final/instrumentation.apk app/build/intermediates/apk/androidTest/rootlessFdroid/release/ViPER4Android-rootless-fdroid-release-androidTest.apk
          curl -fL 'https://github.com/alienware377/RootlessViPER4Android/releases/download/v4.0.0/ViPER4Android-v4.0.0-rootless-fdroid-x86_64-release.apk' -o /tmp/rv4a-original.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual update, native, direct-effect and bound-service lifecycle tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disable-animations: true
          script: bash ci/direct-final-android16.sh
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-direct-session-evidence
          path: startup-evidence/
