name: RootlessViPER4Android Android 16 launch smoke test

on:
  push:
    branches:
      - fix/audio-failopen-debug-20261012
    paths:
      - '.github/workflows/android16-launch-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  emulator-android16:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download previously compiled and signed x86_64 test APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-apks
          gh run download 38220472293 --name RootlessViPER4Android-patched-DEBUG-APKs --dir ci-apks
          test -s ci-apks/ViPER4Android-v4.0.0-rootless-fdroid-x86_64-debug.apk

      - name: Enable hardware acceleration
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi

      - name: Boot Android 16 and test launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            PKG=com.alienware377.viper4android.rootless.debug
            APK=ci-apks/ViPER4Android-v4.0.0-rootless-fdroid-x86_64-debug.apk
            adb logcat -c
            adb install -r "$APK"
            adb shell pm path "$PKG"
            adb shell am start -W -n "$PKG/me.timschneeberger.rootlessjamesdsp.activity.MainActivity" | tee launch-result.txt
            sleep 15
            adb shell dumpsys activity activities > activity-dump.txt || true
            adb shell logcat -d -v threadtime > launch-logcat.txt || true
            adb exec-out screencap -p > launch-screen.png || true
            adb shell uiautomator dump /sdcard/window.xml || true
            adb shell cat /sdcard/window.xml > window.xml || true
            echo "package process:"
            adb shell pidof "$PKG" || true
            echo "foreground activity:"
            grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' activity-dump.txt | head -n 10 || true
            echo "fatal and ANR reports:"
            grep -Ei 'FATAL EXCEPTION|SIGSEGV|SIGABRT|Process: com.alienware377.viper4android.rootless.debug|ANR in' launch-logcat.txt | tail -n 60 || true
            if grep -Eq 'Cannot launch application. Please re-download|Launch error [123]' window.xml launch-logcat.txt; then
              echo 'FAIL: built-in app launch guard rejected debug APK' >&2; exit 10
            fi
            if grep -E 'FATAL EXCEPTION|Fatal signal|ANR in' launch-logcat.txt | grep -q "$PKG"; then
              echo 'FAIL: Android crashed the patched app' >&2; exit 11
            fi
            if ! adb shell pidof "$PKG" >/dev/null; then
              echo 'FAIL: Application process not running 15 seconds after start' >&2; exit 12
            fi
            echo 'PASS: Android 16 booted and app process stayed alive after startup; in-app permissions and audio remain untested.'

      - name: Upload emulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv4a-android16-launch-report
          path: |
            launch-result.txt
            launch-logcat.txt
            activity-dump.txt
            launch-screen.png
            window.xml
          if-no-files-found: warn
          retention-days: 7
