name: Build signed in-place RootlessViPER4Android audiofix update

on:
  push:
    branches:
      - fix/audio-failopen-debug-20261012
    paths:
      - '.github/workflows/build-rootless-audiofix-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verified-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Build signed RootlessViPER4Android release without debug extras
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRootlessFdroidRelease --no-daemon --stacktrace

      - name: Validate certificate, exact package, version and architectures
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$APKSIGNER" && test -n "$AAPT"
          files=(app/build/outputs/apk/rootlessFdroid/release/*.apk)
          test "${#files[@]}" -ge 1
          : > dist-manifest.txt
          for apk in "${files[@]}"; do
            echo "APK: $apk" | tee -a dist-manifest.txt
            "$APKSIGNER" verify --verbose --print-certs "$apk" > "$apk.signing.txt"
            line=$("$AAPT" dump badging "$apk" | grep -m1 '^package:')
            echo "$line" | tee -a dist-manifest.txt
            [[ "$line" == *"name='com.alienware377.viper4android.rootless'"* ]]
            [[ "$line" == *"versionCode='128'"* ]]
            digest=$(grep 'certificate SHA-256 digest:' "$apk.signing.txt" | head -n 1 | awk '{print $NF}')
            echo "Signer SHA256: $digest" | tee -a dist-manifest.txt
            [[ "$digest" == "dfc8c77e9f4ec2b8ff5d133320df6f51eb2440fa32cb07f5d1a910199e3f9675" ]]
            sha256sum "$apk" | tee -a dist-manifest.txt
          done
          arm=(app/build/outputs/apk/rootlessFdroid/release/*arm64-v8a-release.apk)
          test "${#arm[@]}" -eq 1
          cp "${arm[0]}" RootlessViPER4Android-v4.0.0-audiofix.1-arm64-update.apk
          test -s RootlessViPER4Android-v4.0.0-audiofix.1-arm64-update.apk

      - name: Upload verified APKs
        uses: actions/upload-artifact@v4
        with:
          name: RV4A-v4.0.0-audiofix.1-rootless-signed-update
          path: |
            app/build/outputs/apk/rootlessFdroid/release/*.apk
            dist-manifest.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish public experimental APK update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create rv4a-v4.0.0-audiofix.1-trial \
            RootlessViPER4Android-v4.0.0-audiofix.1-arm64-update.apk \
            --target "$GITHUB_SHA" \
            --title "RootlessViPER4Android v4.0.0-audiofix.1 — Experimental In-Place Update" \
            --notes "Experimental ARM64 rootless audio recovery update. Same original applicationId (com.alienware377.viper4android.rootless) and signing SHA-256 certificate as the upstream v4.0.0 official release (dfc8c77e9f4ec2b8ff5d133320df6f51eb2440fa32cb07f5d1a910199e3f9675), versionCode 128. This may update an official v4.0.0 install without deleting its data or permissions. BACK UP YOUR AUDIO PRESETS FIRST. NEVER UNINSTALL THE WORKING ORIGINAL TO INSTALL THIS TRIAL. Android will reject it if the existing app uses a different signing certificate. This only verifies build/installation compatibility; Android 16/HONOR audio behavior is not yet validated. See pull request #1 for source and changes." \
            --prerelease
          gh release view rv4a-v4.0.0-audiofix.1-trial --json url,assets
