name: Audio recovery ARM64 diagnostic
on:
  push:
    branches: [ 'repair/audio-recovery' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Build and test
        run: ./gradlew testRootlessFdroidReleaseUnitTest assembleRootlessFdroidRelease --no-daemon
      - name: Inspect delivered ARM64 APK
        shell: bash
        run: |
          mkdir -p evidence
          APK=$(find app/build/outputs/apk/rootlessFdroid/release -name '*arm64-v8a*.apk' | head -1)
          test -n "$APK"
          cp "$APK" evidence/RootlessViPER4Android-4.0.2-diagnostic-arm64.apk
          sha256sum evidence/*.apk > evidence/SHA256SUMS
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > evidence/signature.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" > evidence/package.txt
          unzip -q "$APK" 'lib/arm64-v8a/*' -d evidence/extracted
          READELF=$(find "$ANDROID_HOME/ndk" -path '*/bin/llvm-readelf' | head -1)
          for SO in evidence/extracted/lib/arm64-v8a/*.so; do
            "$READELF" -h -d -l -Ws "$SO" > "evidence/$(basename "$SO").elf.txt"
          done
          python3 tools/verify_apk_native.py evidence/extracted/lib/arm64-v8a "$READELF" > evidence/native-verification.txt
          git rev-parse HEAD > evidence/commit.txt
          date -u +%FT%TZ > evidence/inspection-time.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-recovery-arm64
          path: |
            evidence/
            app/build/test-results/testRootlessFdroidReleaseUnitTest/
  native-android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedRootlessFdroidDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=me.timschneeberger.rootlessjamesdsp.interop.NativeAudioRecoveryTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-test-results
          path: app/build/outputs/androidTest-results/
