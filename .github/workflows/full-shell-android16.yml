name: Android 16 full native engine and routing recovery
on:
  workflow_dispatch:
  push:
    branches: [qa/full-shell-android16]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Fetch official Shizuku for actual consent and IPC validation
        run: |
          curl -fL --max-time 60 'https://github.com/RikkaApps/Shizuku/releases/download/v13.6.0/shizuku-v13.6.0.r1086.2650830c-release.apk' -o /tmp/shizuku.apk
          echo '6e273ab0e991c4e79bc8b1bbb9b9dd739ccac1a8712a541a214078886b7b790f  /tmp/shizuku.apk' | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disable-animations: true
          script: bash ci/full-shell-android16.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-shell-evidence
          path: full-shell-evidence/
